# Push and update articles on dev.to whenever posts change on main.
#
# Required secret:
#   DEVTO_TOKEN  dev.to API key (https://dev.to/settings/extensions)
#
# After publishing, devto-cli writes `id` / `date` back into the front matter.
# That diff is committed back to main by this workflow.

name: publish

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: devto-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVTO_CLI_VERSION: 1.4.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Publish articles on dev.to
        env:
          DEVTO_TOKEN: ${{ secrets.DEVTO_TOKEN }}
        run: |
          npx --yes "@sinedied/devto-cli@${DEVTO_CLI_VERSION}" push 'posts/**/*.md' \
            --repo "${{ github.repository }}" \
            --branch main

      - name: Commit updated front matter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --staged --quiet; then
            echo "No front matter changes."
            exit 0
          fi
          git commit -m "chore(posts): sync dev.to article metadata [skip ci]"
          git push
